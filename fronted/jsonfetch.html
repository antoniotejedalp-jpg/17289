    <script>
        elemento_imagen = document.getElementById("img1")
        function llamar(){
            url = "https://jsonplaceholder.typicode.com/users/1";
            parametros = ""
            fetch(url)
            .then(respuesta=>{
                usuario = respuesta.json()
                console.log(usuario)
                return usuario
            })
            .then(datos=>{
                console.log(datos)
                u = datos
                console.log(u.name)
            })

            .catch(error =>{
                console.log(error)
            })
        }

        function llamar3(){
            url = "https://jsonplaceholder.typicode.com/users/1";
            parametros = ""
            fetch(url)
            .then(async respuesta=>{
                console.log("respuesta")
                console.log(respuesta)
                usuario = await respuesta.json()
                console.log(usuario)
                return usuario
            })
            .then(datos=>{

                u = datos
                console.log(u.name)
            })
